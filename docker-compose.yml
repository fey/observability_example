name: observability-example

services:
  shop-api:
    build:
      context: ./app
    container_name: shop-api
    environment:
      APP_NAME: shop-api
      APP_ENV: local
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://shop:shop@postgres:5432/shop
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    networks:
      - observability

  nginx:
    image: nginx:1.27-alpine
    container_name: edge-nginx
    depends_on:
      - shop-api
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - observability

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - observability

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - observability

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://shop:shop@postgres:5432/shop?sslmode=disable
    depends_on:
      - postgres
    ports:
      - "9187:9187"
    networks:
      - observability

  node-exporter-1:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter-1
    command:
      - --path.rootfs=/host
      - --web.listen-address=:9100
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9101:9100"
    networks:
      - observability

  node-exporter-2:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter-2
    command:
      - --path.rootfs=/host
      - --web.listen-address=:9100
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9102:9100"
    networks:
      - observability

  node-exporter-3:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter-3
    command:
      - --path.rootfs=/host
      - --web.listen-address=:9100
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9103:9100"
    networks:
      - observability

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.26.0
    container_name: blackbox-exporter
    ports:
      - "9115:9115"
    networks:
      - observability

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - shop-api
      - node-exporter-1
      - node-exporter-2
      - node-exporter-3
      - postgres-exporter
      - blackbox-exporter
    ports:
      - "9090:9090"
    networks:
      - observability

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    ports:
      - "9093:9093"
    networks:
      - observability

  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    networks:
      - observability

  netdata:
    image: netdata/netdata:v2.10.3
    container_name: netdata
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    ports:
      - "19999:19999"
    volumes:
      - netdata-config:/etc/netdata
      - netdata-lib:/var/lib/netdata
      - netdata-cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
    networks:
      - observability

  loadgen:
    image: curlimages/curl:8.12.1
    container_name: loadgen
    depends_on:
      - nginx
    command:
      - /bin/sh
      - -ec
      - |
        while true; do
          curl -sS "http://nginx/" > /dev/null || true
          curl -sS "http://nginx/checkout" > /dev/null || true
          sleep 0.2
        done
    networks:
      - observability

  zabbix-db:
    image: postgres:16-alpine
    container_name: zabbix-db
    profiles: ["zabbix"]
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
    volumes:
      - zabbix-db-data:/var/lib/postgresql/data
    networks:
      - observability

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:7.2-latest
    container_name: zabbix-server
    profiles: ["zabbix"]
    depends_on:
      - zabbix-db
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
    ports:
      - "10051:10051"
    networks:
      - observability

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:7.2-latest
    container_name: zabbix-web
    profiles: ["zabbix"]
    depends_on:
      - zabbix-server
      - zabbix-db
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
      PHP_TZ: Europe/Moscow
    ports:
      - "8081:8080"
    networks:
      - observability

  zabbix-agent:
    image: zabbix/zabbix-agent2:7.2-latest
    container_name: zabbix-agent
    profiles: ["zabbix"]
    environment:
      ZBX_HOSTNAME: zabbix-agent
      ZBX_SERVER_HOST: zabbix-server
      ZBX_ACTIVE_ALLOW: "true"
    ports:
      - "10050:10050"
    networks:
      - observability

  zabbix-bootstrap:
    image: python:3.12-alpine
    container_name: zabbix-bootstrap
    profiles: ["zabbix"]
    depends_on:
      - zabbix-web
      - zabbix-agent
    volumes:
      - ./zabbix/bootstrap.py:/opt/bootstrap.py:ro
    command:
      - /bin/sh
      - -ec
      - |
        python /opt/bootstrap.py
    networks:
      - observability

  nagios:
    image: jasonrivers/nagios:latest
    container_name: nagios
    profiles: ["nagios"]
    ports:
      - "8082:80"
    volumes:
      - ./nagios/objects/zz-observability.cfg:/opt/nagios/etc/objects/zz-observability.cfg:ro
    networks:
      - observability

networks:
  observability:
    driver: bridge

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
  netdata-config:
  netdata-lib:
  netdata-cache:
  zabbix-db-data:
