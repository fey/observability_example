define host {
  use                     linux-server
  host_name               edge-nginx
  alias                   edge-nginx
  address                 nginx
  max_check_attempts      3
  check_period            24x7
  notification_interval   30
  notification_period     24x7
}

define service {
  use                             generic-service
  host_name                       edge-nginx
  service_description             HTTP root is reachable
  check_command                   check_http!-H nginx -u /
  max_check_attempts              3
  check_interval                  1
  retry_interval                  1
  check_period                    24x7
  notification_interval           30
  notification_period             24x7
}

define service {
  use                             generic-service
  host_name                       edge-nginx
  service_description             Demo warning service
  check_command                   check_dummy!1!Synthetic warning for screenshot
  max_check_attempts              1
  check_interval                  1
  retry_interval                  1
  check_period                    24x7
  notification_interval           30
  notification_period             24x7
}

define service {
  use                             generic-service
